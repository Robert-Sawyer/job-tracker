services:
  db:
    image: postgres:17-alpine
    container_name: jobtracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:17-alpine
    container_name: jobtracker-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
      POSTGRES_DB: jobtracker_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres -c fsync=off -c full_page_writes=off
               -c synchronous_commit=off -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: jobtracker-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
