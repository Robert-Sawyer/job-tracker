name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobtracker
          POSTGRES_PASSWORD: jobtracker
          POSTGRES_DB: jobtracker_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U jobtracker -d jobtracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://jobtracker:jobtracker@localhost:5434/jobtracker_test?schema=public

      - name: Create isolated shadow database for migration diff
        run: >-
          node --input-type=module -e
          "import { Client } from 'pg'; const client = new Client({ host: 'localhost', port: 5434, user: 'jobtracker', password: 'jobtracker', database: 'postgres' }); await client.connect(); await client.query('CREATE DATABASE jobtracker_shadow'); await client.end();"

      - name: Verify migrations are in sync with schema
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://jobtracker:jobtracker@localhost:5434/jobtracker_test?schema=public
          SHADOW_DATABASE_URL: postgresql://jobtracker:jobtracker@localhost:5434/jobtracker_shadow?schema=public
        continue-on-error: false

      - name: Run tests with coverage
        working-directory: apps/api
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://jobtracker:jobtracker@localhost:5434/jobtracker_test?schema=public

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: job-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint node job-tracker-api:ci --version
